<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Deduplication</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="sidebar">
    <h5><i class="bi bi-hdd-stack"></i> Intelligent Data Deduplication</h5>
    <a href="{{ url_for('upload') }}" class="{{ 'active' if page == 'upload' }}"><i class="bi bi-cloud-upload"></i> Upload Files</a>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if page == 'dashboard' }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="{{ url_for('duplicates') }}" class="{{ 'active' if page == 'duplicates' }}"><i class="bi bi-files"></i> Duplicates &amp; Similarity</a>
    <a href="{{ url_for('files') }}" class="{{ 'active' if page == 'files' }}"><i class="bi bi-folder2-open"></i> My Files</a>
  </div>
  <div class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
